<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Dashboard | Liturgie Digitaal</title>
  <meta name="theme-color" content="#c89154" />
  <link rel="manifest" href="/dashboard/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <meta name="apple-mobile-web-app-title" content="Liturgie" />
  <link rel="stylesheet" href="/styles.css" />
</head>

<body class="dashboard-page">
  <div class="dashboard-layout">
    <div class="preview-shell">
      <div class="preview-viewport">
        <div class="liturgie-container dashboard-preview">
          <div id="liturgie" class="liturgie-tekst">
            Liturgie wordt geladen...
          </div>
        </div>
      </div>
    </div>

    <div class="dashboard-panel">
      <div class="panel-row">
        <button id="save-button" class="save-button">Opslaan</button>
        <a href="/" class="nav-button">Terug naar start</a>
      </div>
      <div id="overflow-warning" class="save-warning"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status"></div>

  <script src="/liturgie-render.js"></script>
  <script src="/dashboard/auth.js"></script>
  <script>
    // Het beamerscherm staat in portrait.
    const DESIGN_WIDTH = 1080;
    const DESIGN_HEIGHT = 1920;

    const liturgieEl = document.getElementById("liturgie");
    const previewEl = document.querySelector(".dashboard-preview");
    const viewportEl = document.querySelector(".preview-viewport");
    const saveBtn = document.getElementById("save-button");
    const toastEl = document.getElementById("toast");
    let toastTimer = null;
    const warningEl = document.getElementById("overflow-warning");

    let dashboardInitialized = false;
    let dirty = false;

    // ---------- Preview op schaal van de beamer ----------

    function updatePreviewScale() {
      // Beschikbare ruimte: de pagina minus padding, minus de knoppenrij eronder.
      const layout = document.querySelector(".dashboard-layout");
      const panel = document.querySelector(".dashboard-panel");
      const cs = getComputedStyle(layout);
      const gap = parseFloat(cs.rowGap) || 0;
      const availableWidth = layout.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      const availableHeight = layout.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom)
        - panel.offsetHeight - gap;
      const scale = Math.min(availableWidth / DESIGN_WIDTH, availableHeight / DESIGN_HEIGHT, 1);
      const width = DESIGN_WIDTH * scale;
      previewEl.style.transform = `scale(${scale})`;
      viewportEl.style.width = `${width}px`;
      viewportEl.style.height = `${DESIGN_HEIGHT * scale}px`;
      // Knoppenrij even breed als de preview
      panel.style.width = `${width}px`;
    }

    // ---------- Renderen en teruglezen ----------

    function updateOverflowWarning() {
      const count = LiturgieRender.markOverflow(liturgieEl, previewEl);
      warningEl.textContent = count === 0
        ? ""
        : count === 1
          ? "1 regel valt buiten het scherm."
          : `${count} regels vallen buiten het scherm.`;
      const wasShown = warningEl.classList.contains("show");
      warningEl.classList.toggle("show", count > 0);
      if (wasShown !== (count > 0)) updatePreviewScale();
    }

    function renderLiturgie(tekst) {
      LiturgieRender.render(liturgieEl, tekst, { editable: true, container: previewEl });
      updateOverflowWarning();
    }

    function extractTextFromLiturgie() {
      const lines = Array.from(liturgieEl.querySelectorAll(".liturgie-line"))
        .map((line) => LiturgieRender.lineText(line).trimEnd());

      // Lege regels onderaan zijn alleen opvulling
      while (lines.length > 0 && lines[lines.length - 1] === "") {
        lines.pop();
      }
      return lines.join("\n");
    }

    // ---------- Caret-hulpfuncties ----------

    function getCaretCharacterOffsetWithin(element) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return null;
      const range = selection.getRangeAt(0);

      if (range.endContainer === element) {
        return range.endOffset;
      }

      let offset = 0;
      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        if (node === range.endContainer) {
          return offset + range.endOffset;
        }
        offset += node.textContent.length;
      }
      return null;
    }

    function setCaretAtOffset(element, offset) {
      const selection = window.getSelection();
      const range = document.createRange();
      let currentOffset = 0;

      const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null);
      let node;
      while ((node = walker.nextNode())) {
        const nextOffset = currentOffset + node.textContent.length;
        if (offset <= nextOffset) {
          range.setStart(node, offset - currentOffset);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
          return;
        }
        currentOffset = nextOffset;
      }

      range.selectNodeContents(element);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function findLine(node) {
      while (node && !(node.classList && node.classList.contains("liturgie-line"))) {
        node = node.parentNode;
      }
      return node;
    }

    function updateLineText(lineEl, newText, caretPos) {
      LiturgieRender.styleLine(lineEl, newText);
      setCaretAtOffset(lineEl, Math.max(0, Math.min(caretPos, lineEl.textContent.length)));
      markDirty();
    }

    function applyStylingToLine(lineEl) {
      const caretOffset = getCaretCharacterOffsetWithin(lineEl);
      const text = LiturgieRender.lineText(lineEl);
      LiturgieRender.styleLine(lineEl, text);
      if (caretOffset !== null) {
        setCaretAtOffset(lineEl, Math.min(caretOffset, lineEl.textContent.length));
      }
      markDirty();
    }

    // ---------- Opslaan ----------

    function setDirty(value) {
      dirty = value;
      saveBtn.classList.toggle("dirty", dirty);
    }

    function markDirty() {
      if (!dirty) setDirty(true);
      updateOverflowWarning();
    }

    // Melding rechtsboven die vanzelf verdwijnt.
    function showStatus(text, isError) {
      clearTimeout(toastTimer);
      toastEl.textContent = text;
      toastEl.className = "toast show " + (isError ? "error" : "ok");
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), isError ? 5000 : 2500);
    }

    async function laadLiturgie() {
      try {
        const res = await fetch("/api/get-liturgie", { cache: "no-store" });
        const data = await res.json();
        renderLiturgie(data.tekst || "");
        setDirty(false);
      } catch (err) {
        console.error(err);
        liturgieEl.textContent = err instanceof TypeError
          ? "Server niet bereikbaar. Draait de server, en is deze pagina via de server geopend?"
          : "Fout bij laden van de liturgie: " + err.message;
      }
    }

    async function opslaanLiturgie() {
      if (saveBtn.disabled) return;
      try {
        saveBtn.disabled = true;

        const tekst = extractTextFromLiturgie();
        const res = await fetch("/api/set-liturgie", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...LiturgieAuth.authHeaders() },
          body: JSON.stringify({ tekst })
        });

        if (res.status === 401) {
          showStatus("Wachtwoord niet meer geldig. Log opnieuw in.", true);
          LiturgieAuth.forget();
          LiturgieAuth.ensureAuth(() => showStatus("Ingelogd. Sla opnieuw op."));
          return;
        }

        const data = await res.json();
        if (data.ok) {
          setDirty(false);
          showStatus("Opgeslagen");
        } else {
          showStatus(data.error || "Fout bij opslaan.", true);
        }
      } catch (err) {
        console.error(err);
        showStatus("Fout bij opslaan.", true);
      } finally {
        saveBtn.disabled = false;
      }
    }

    // ---------- Init ----------

    function initDashboard() {
      if (dashboardInitialized) return;
      dashboardInitialized = true;

      saveBtn.addEventListener("click", opslaanLiturgie);

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") {
          e.preventDefault();
          opslaanLiturgie();
        }
      });

      window.addEventListener("beforeunload", (e) => {
        if (dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      // Opmaak bijwerken tijdens het typen
      liturgieEl.addEventListener("input", (e) => {
        const line = findLine(e.target);
        if (line) applyStylingToLine(line);
      });

      // Plakken: alleen platte tekst, op één regel
      liturgieEl.addEventListener("paste", (e) => {
        e.preventDefault();
        const line = findLine(e.target);
        if (!line) return;
        const pasted = (e.clipboardData.getData("text/plain") || "").replace(/\s+/g, " ");
        if (!pasted) return;
        const offset = getCaretCharacterOffsetWithin(line) ?? 0;
        const text = LiturgieRender.lineText(line);
        updateLineText(line, text.slice(0, offset) + pasted + text.slice(offset), offset + pasted.length);
      });

      // Enter geblokkeerd, pijltjes tussen regels, Backspace/Delete zelf afhandelen
      liturgieEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          return;
        }

        const selection = window.getSelection();
        if (!selection.rangeCount) return;
        const currentLine = findLine(selection.getRangeAt(0).startContainer);
        if (!currentLine) return;

        const caretOffset = getCaretCharacterOffsetWithin(currentLine) ?? 0;

        if (e.key === "Backspace") {
          e.preventDefault();
          if (caretOffset === 0) return;
          const text = LiturgieRender.lineText(currentLine);
          updateLineText(currentLine, text.slice(0, caretOffset - 1) + text.slice(caretOffset), caretOffset - 1);
          return;
        }

        if (e.key === "Delete") {
          e.preventDefault();
          const text = LiturgieRender.lineText(currentLine);
          if (caretOffset >= text.length) return;
          updateLineText(currentLine, text.slice(0, caretOffset) + text.slice(caretOffset + 1), caretOffset);
          return;
        }

        if (e.key === "ArrowUp" || e.key === "ArrowDown") {
          const targetLine = e.key === "ArrowUp"
            ? currentLine.previousElementSibling
            : currentLine.nextElementSibling;
          if (targetLine && targetLine.classList.contains("liturgie-line")) {
            e.preventDefault();
            setCaretAtOffset(targetLine, Math.min(caretOffset, targetLine.textContent.length));
          }
        }
      });

      laadLiturgie();
    }

    updatePreviewScale();
    window.addEventListener("resize", updatePreviewScale);
    LiturgieAuth.ensureAuth(initDashboard);
  </script>
</body>

</html>
