<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Afbeelding instellen | Liturgie Digitaal</title>
  <meta name="theme-color" content="#c89154" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-180.png" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    /* Vaste pagina: kop, preview die de rest vult, knoppenrij onderaan. Geen scrollen. */
    body {
      background: #0b0f1a;
      color: #e2e8f0;
      font-family: "Urbanist", sans-serif;
      text-transform: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 12px;
      box-sizing: border-box;
    }

    .kop {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .kop h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
      color: #94a3b8;
    }

    .kop .nav-button {
      padding: 12px 16px;
      font-size: 16px;
    }

    .preview {
      flex: 1;
      min-height: 0;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .preview .leeg {
      color: #64748b;
      font-size: 17px;
      text-align: center;
      padding: 20px;
    }

    .preview .label {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 6px 10px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.7);
      color: #cbd5e1;
      font-size: 13px;
    }

    .preview .label.nieuw {
      background: #c89154;
      color: #111;
    }

    .rij {
      display: flex;
      gap: 10px;
    }

    .knop {
      flex: 1;
      min-width: 0;
      padding: 18px 20px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      font-family: inherit;
      font-size: 19px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }

    .knop:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .knop.primair {
      background: #c89154;
      border-color: #c89154;
      color: #111;
    }

    .knop.primair:hover {
      background: #d4a066;
    }

    .knop.smal {
      flex: none;
    }

    .knop.gevaar {
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.4);
    }

    .knop:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .rij.verborgen {
      display: none;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="kop">
    <a href="/" class="nav-button">Terug naar start</a>
    <h1>Afbeelding</h1>
  </div>

  <div class="preview">
    <span id="leeg" class="leeg">Geen afbeelding ingesteld</span>
    <img id="preview-img" alt="" hidden />
    <span id="label" class="label" hidden></span>
  </div>

  <div id="rij-kies" class="rij">
    <button id="kies-btn" class="knop" type="button">Kies afbeelding</button>
    <button id="remove-btn" class="knop smal gevaar" type="button" disabled>Verwijderen</button>
  </div>

  <div id="rij-opslaan" class="rij verborgen">
    <button id="upload-btn" class="knop primair" type="button">Opslaan</button>
    <button id="annuleer-btn" class="knop smal" type="button">Annuleren</button>
  </div>

  <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" />

  <div id="toast" class="toast" role="status"></div>

  <script src="/dashboard/auth.js"></script>
  <script>
    const fileInput = document.getElementById('file-input');
    const kiesBtn = document.getElementById('kies-btn');
    const uploadBtn = document.getElementById('upload-btn');
    const annuleerBtn = document.getElementById('annuleer-btn');
    const removeBtn = document.getElementById('remove-btn');
    const previewImg = document.getElementById('preview-img');
    const leegEl = document.getElementById('leeg');
    const labelEl = document.getElementById('label');
    const rijKies = document.getElementById('rij-kies');
    const rijOpslaan = document.getElementById('rij-opslaan');
    const toastEl = document.getElementById('toast');

    let huidigeFilename = null;
    let selectedFile = null;
    let toastTimer = null;

    function showStatus(text, isError) {
      clearTimeout(toastTimer);
      toastEl.textContent = text;
      toastEl.className = 'toast show ' + (isError ? 'error' : 'ok');
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), isError ? 5000 : 2500);
    }

    function toonPreview(src, labelTekst, nieuw) {
      if (src) {
        previewImg.src = src;
        previewImg.hidden = false;
        leegEl.hidden = true;
      } else {
        previewImg.removeAttribute('src');
        previewImg.hidden = true;
        leegEl.hidden = false;
      }
      labelEl.textContent = labelTekst || '';
      labelEl.hidden = !labelTekst;
      labelEl.classList.toggle('nieuw', Boolean(nieuw));
    }

    function toonHuidige() {
      selectedFile = null;
      fileInput.value = '';
      rijKies.classList.remove('verborgen');
      rijOpslaan.classList.add('verborgen');
      removeBtn.disabled = !huidigeFilename;
      toonPreview(
        huidigeFilename ? '/uploads/' + encodeURIComponent(huidigeFilename) + '?t=' + Date.now() : null,
        huidigeFilename ? 'Nu op het bord' : '',
        false
      );
    }

    async function loadCurrent() {
      try {
        const res = await fetch('/api/get-image', { cache: 'no-store' });
        const data = await res.json();
        huidigeFilename = (data && data.filename) || null;
        toonHuidige();
      } catch (err) {
        console.error(err);
        showStatus('Server niet bereikbaar.', true);
      }
    }

    function handleUnauthorized(opnieuw) {
      LiturgieAuth.forget();
      LiturgieAuth.ensureAuth(opnieuw);
    }

    kiesBtn.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;
      selectedFile = f;
      toonPreview(URL.createObjectURL(f), 'Nieuw, nog niet opgeslagen', true);
      rijKies.classList.add('verborgen');
      rijOpslaan.classList.remove('verborgen');
    });

    annuleerBtn.addEventListener('click', toonHuidige);

    async function upload() {
      if (!selectedFile) return;
      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Bezig...';
      try {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error);
          reader.readAsDataURL(selectedFile);
        });
        const res = await fetch('/api/set-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...LiturgieAuth.authHeaders() },
          body: JSON.stringify({ data: dataUrl })
        });
        if (res.status === 401) { handleUnauthorized(upload); return; }
        const result = await res.json();
        if (result.ok) {
          huidigeFilename = result.filename;
          toonHuidige();
          showStatus('Opgeslagen');
        } else {
          showStatus(result.error || 'Opslaan mislukt.', true);
        }
      } catch (err) {
        console.error(err);
        showStatus('Opslaan mislukt.', true);
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Opslaan';
      }
    }

    uploadBtn.addEventListener('click', () => LiturgieAuth.ensureAuth(upload));

    async function verwijder() {
      removeBtn.disabled = true;
      try {
        const res = await fetch('/api/clear-image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...LiturgieAuth.authHeaders() },
          body: '{}'
        });
        if (res.status === 401) { handleUnauthorized(verwijder); return; }
        const result = await res.json();
        if (result.ok) {
          huidigeFilename = null;
          toonHuidige();
          showStatus('Afbeelding verwijderd');
        } else {
          showStatus(result.error || 'Verwijderen mislukt.', true);
          removeBtn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        showStatus('Verwijderen mislukt.', true);
        removeBtn.disabled = false;
      }
    }

    removeBtn.addEventListener('click', () => {
      if (!confirm('Afbeelding van het bord verwijderen?')) return;
      LiturgieAuth.ensureAuth(verwijder);
    });

    LiturgieAuth.ensureAuth(loadCurrent);
  </script>
</body>
</html>
